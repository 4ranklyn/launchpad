      // Guard against environments where window.fetch only has a getter defined,
      // preventing "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // when polyfills, extensions, or interceptors assign window.fetch
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _f;
            },
            set: function(val) {
              _f = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
